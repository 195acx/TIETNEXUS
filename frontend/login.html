<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | TIET NExus</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">

</head>

<body>

    <div class="page">

        <nav class="navbar">

            <a href="index.html" class="brand">
                TIET
                <span>NExus</span>
            </a>

        </nav>


        <main class="auth-page">

            <p class="page-label">
                TIET NExus
            </p>

            <h1 class="page-title">
                LOGIN.
            </h1>


            <form id="loginForm">

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    LOGIN
                </button>

            </form>


            <div class="auth-divider">
                OR
            </div>


            <h2>
                CREATE ACCOUNT
            </h2>


            <form id="signupForm">

                <input
                    id="signupName"
                    type="text"
                    placeholder="Name"
                    required
                >

                <input
                    id="signupEmail"
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    id="signupPassword"
                    type="password"
                    placeholder="Password (6+ characters)"
                    required
                >

                <button type="submit">
                    SIGN UP
                </button>

            </form>


            <p id="authMessage"></p>

        </main>

    </div>


    <script src="js/main.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
