<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Societies | TIET NExus</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>

    <div class="page">

        <nav class="navbar">

            <a href="index.html" class="brand">
                TIET
                <span>NExus</span>
            </a>

            <div class="nav-links">

                <a href="societies.html">Societies</a>

                <a href="events.html">Events</a>

                <a href="guide.html">AI Guide</a>

                <a href="#" class="login-link">Login</a>

            </div>

        </nav>


        <header class="page-header">

            <p class="page-label">DISCOVER</p>

            <h1 class="page-title">
                SOCIETIES.
            </h1>

            <p class="page-subtitle">
                Find your people.
                Discover communities built around
                technology, culture, creativity,
                entrepreneurship and more.
            </p>

        </header>


        <main>

            <div class="search-container">

                <input
                    id="societySearch"
                    type="text"
                    placeholder="Search societies..."
                >

            </div>


            <div class="filters">

                <button
                    class="filter active"
                    data-category="All">
                    ALL
                </button>

                <button
                    class="filter"
                    data-category="Technology">
                    TECH
                </button>

                <button
                    class="filter"
                    data-category="Cultural">
                    CULTURAL
                </button>

                <button
                    class="filter"
                    data-category="Entrepreneurship">
                    ENTREPRENEURSHIP
                </button>

                <button
                    class="filter"
                    data-category="Sports">
                    SPORTS
                </button>

            </div>


            <section
                id="societyList"
                class="society-list">
            </section>

        </main>

    </div>


    <script src="js/main.js"></script>
    <script src="js/societies.js"></script>

</body>

</html>
